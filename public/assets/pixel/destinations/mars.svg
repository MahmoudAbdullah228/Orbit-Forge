<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges" style="image-rendering: pixelated;">

    <rect width="64" height="64" fill="#0A0626"/>
    <!-- Mars Body -->
    <rect x="16" y="8" width="32" height="48" fill="#F81414"/>
    <rect x="8" y="16" width="48" height="32" fill="#F81414"/>
    <rect x="12" y="12" width="40" height="40" fill="#F81414"/>
    <!-- Polar Ice Cap -->
    <rect x="24" y="8" width="16" height="4" fill="#EEF1F8"/>
    <rect x="28" y="12" width="8" height="2" fill="#EEF1F8"/>
    <!-- Dark Canyons (Valles Marineris) -->
    <rect x="16" y="32" width="28" height="4" fill="#A80C0C"/>
    <rect x="20" y="36" width="18" height="3" fill="#A80C0C"/>
    <!-- Craters & Dunes -->
    <rect x="20" y="20" width="6" height="6" fill="#A80C0C"/>
    <rect x="38" y="22" width="8" height="6" fill="#A80C0C"/>
    <rect x="32" y="44" width="10" height="4" fill="#A80C0C"/>
    <!-- Atmosphere haze -->
    <rect x="10" y="14" width="2" height="36" fill="#FF9A1F" opacity="0.5"/>
  
</svg>